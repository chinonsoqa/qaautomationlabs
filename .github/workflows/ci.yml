name: end-to-end tests

on:
  push:
    branches:
      - github-actions

  schedule:
    # Runs every 5 hours
    - cron: "0 */5 * * *"

  # Optional: allow manual runs from Actions tab
  workflow_dispatch:

concurrency:
  # Prevent overlapping runs on same workflow/branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end-tests:
    runs-on: ubuntu-latest

    # ✅ Best practice: stop runaway runs before GitHub’s default 6h cancellation
    timeout-minutes: 90

    env:
      # ✅ CI-safe + faster installs
      CI: "true"

      # ✅ Cypress timeouts to avoid hanging forever
      CYPRESS_defaultCommandTimeout: "10000"
      CYPRESS_pageLoadTimeout: "60000"
      CYPRESS_requestTimeout: "15000"
      CYPRESS_responseTimeout: "30000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create output folders
        run: |
          mkdir -p reports/junit
          mkdir -p reports/mochawesome
          mkdir -p cypress/screenshots
          mkdir -p cypress/videos

      # -------------------------------
      # Multi-reporter config
      # -------------------------------
      - name: Create reporter config (JUnit + Mochawesome JSON)
        run: |
          cat > reporter-config.json <<'EOF'
          {
            "reporterEnabled": "mocha-junit-reporter, mochawesome",
            "mochaJunitReporterReporterOptions": {
              "mochaFile": "reports/junit/junit-[hash].xml",
              "toConsole": true
            },
            "mochawesomeReporterOptions": {
              "reportDir": "reports/mochawesome",
              "overwrite": false,
              "html": false,
              "json": true,
              "quiet": true
            }
          }
          EOF

      # -------------------------------
      # Run Cypress once
      # -------------------------------
      - name: Run Cypress tests (JUnit + Mochawesome)
        uses: cypress-io/github-action@v6
        with:
          install: false
          runTests: true
          command: >
            npx cypress run
            --reporter cypress-multi-reporters
            --reporter-options configFile=reporter-config.json

      # -------------------------------
      # Generate pretty HTML report (SAFE)
      # Skips gracefully if Cypress was cancelled/failed before producing JSON
      # -------------------------------
      - name: Generate Mochawesome HTML report (safe)
        if: always()
        run: |
          if ls reports/mochawesome/*.json 1> /dev/null 2>&1; then
            echo "Mochawesome JSON found. Generating HTML report..."
            npx mochawesome-merge reports/mochawesome/*.json > reports/mochawesome/merged.json
            npx marge reports/mochawesome/merged.json \
              --reportDir reports/mochawesome \
              --reportFilename mochawesome.html
          else
            echo "No Mochawesome JSON files found. Skipping HTML report generation."
          fi

      # -------------------------------
      # Build JUnit summary (SAFE)
      # Works even if no XML exists (sets a helpful summary)
      # -------------------------------
      - name: Build JUnit test summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { XMLParser } = require('fast-xml-parser');

          const junitDir = path.join(process.cwd(), 'reports', 'junit');
          const files = fs.existsSync(junitDir)
            ? fs.readdirSync(junitDir).filter(f => f.endsWith('.xml'))
            : [];

          let total = 0, failures = 0, errors = 0, skipped = 0, time = 0;
          const parser = new XMLParser({ ignoreAttributes: false, attributeNamePrefix: "" });
          const num = (v) => Number.isFinite(Number(v)) ? Number(v) : 0;

          for (const f of files) {
            const xml = fs.readFileSync(path.join(junitDir, f), 'utf8');
            const data = parser.parse(xml);

            const suites = [];
            if (data.testsuite) suites.push(data.testsuite);
            if (data.testsuites?.testsuite) {
              const ts = data.testsuites.testsuite;
              Array.isArray(ts) ? suites.push(...ts) : suites.push(ts);
            }

            for (const s of suites) {
              total    += num(s.tests);
              failures += num(s.failures);
              errors   += num(s.errors);
              skipped  += num(s.skipped);
              time     += num(s.time);
            }
          }

          const failed = failures + errors;
          const passed = Math.max(0, total - failed - skipped);

          const summary = files.length
            ? `Total: ${total} | Passed: ${passed} | Failed: ${failed} (Failures: ${failures}, Errors: ${errors}) | Skipped: ${skipped} | Duration: ${time.toFixed(2)}s`
            : `No JUnit XML found (run may have been cancelled or reporter not produced).`;

          fs.appendFileSync(process.env.GITHUB_ENV, [
            `TEST_TOTAL=${total}`,
            `TEST_PASSED=${passed}`,
            `TEST_FAILED=${failed}`,
            `TEST_SKIPPED=${skipped}`,
            `TEST_DURATION=${time.toFixed(2)}`,
            `TEST_SUMMARY=${summary}`
          ].join('\n') + '\n');

          console.log(summary);
          NODE

      # -------------------------------
      # Upload artifacts (best practice)
      # Always upload reports; screenshots/videos on failure only
      # -------------------------------
      - name: Upload Test Reports (JUnit + Mochawesome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports
          if-no-files-found: warn

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: warn

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: warn

      # -------------------------------
      # Zip reports for email (email-size safe)
      # Never attach screenshots/videos to email (prevents Gmail 25MB failures)
      # -------------------------------
      - name: Zip reports for email
        if: always()
        run: |
          zip -r reports.zip reports || true

      # ===============================
      # EMAIL NOTIFICATIONS
      # Success: attach reports.zip only
      # Failure: attach reports.zip only + point to artifacts in run
      # ===============================

      - name: Send SUCCESS email (reports attached)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: nwosuchinonso.chinedu@gmail.com, email4automatedtesting@gmail.com
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          subject: "✅ Cypress PASSED | ${{ github.repository }} | ${{ github.ref_name }}"
          body: |
            ✅ Cypress E2E Tests PASSED

            Summary:
            ${{ env.TEST_SUMMARY }}

            Repo:    ${{ github.repository }}
            Branch:  ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}

            Attached:
            - reports.zip (JUnit XML + Mochawesome HTML)

            Run link:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Reports artifact (download from run page):
            - test-reports
          attachments: reports.zip

      - name: Send FAILURE email (reports attached + artifact links)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: nwosuchinonso.chinedu@gmail.com, email4automatedtesting@gmail.com
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          subject: "❌ Cypress FAILED | ${{ github.repository }} | ${{ github.ref_name }}"
          body: |
            ❌ Cypress E2E Tests FAILED

            Summary:
            ${{ env.TEST_SUMMARY }}

            Repo:    ${{ github.repository }}
            Branch:  ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}

            Attached:
            - reports.zip (JUnit XML + Mochawesome HTML)

            Run link:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Artifacts available in the run page:
            - test-reports
            - cypress-screenshots (failure only)
            - cypress-videos (failure only)
          attachments: reports.zip

      # ===============================
      # SLACK / TEAMS (INACTIVE FOR NOW)
